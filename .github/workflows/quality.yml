name: Quality Metrics

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    name: Check Quality, Coverage, and Duplications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint (Quality)
        run: ./gradlew lintDebug --continue

      - name: Run Detekt (Quality & Duplications)
        uses: reviewdog/action-detekt@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning

      - name: Run Unit Tests & Coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport --continue || echo "JaCoCo not configured, skipping coverage"

      - name: Run Code Duplication Check (JSCPD)
        uses: jscpd/action@v3
        with:
          path: app/src
          format: kotlin,java,xml
